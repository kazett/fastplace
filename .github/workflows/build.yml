name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Arrange flat sources
        run: |
          mkdir -p src/main/java/com/kazet/fastplace/mixin src/main/resources
          mv FastPlace.java src/main/java/com/kazet/fastplace/
          mv MinecraftAccessor.java src/main/java/com/kazet/fastplace/mixin/
          mv fabric.mod.json fastplace.mixins.json src/main/resources/

      - run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fastplace
          path: build/libs/fastplace-1.0.0.jar
